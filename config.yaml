# cachest route config.
#
# fetch_interval / fetch_max_wait are a PAIR, and the pair sets a concurrency cap:
# RateLimiter claims its slot as `last = now + sleep`, so the Nth waiter sleeps
# N * fetch_interval. fetch_max_wait is therefore a *total queueing budget*, and the
# depth it admits is
#
#     queue_depth = floor(fetch_max_wait / fetch_interval) + 1
#
# Anything past that depth is rejected with an instant 503 and NO upstream call.
# A route's depth must exceed the widest concurrent burst its callers produce — a
# single portfolio sweep is 175+ symbols, so the symbol-keyed openst routes sit at
# 600 (a 175-symbol sweep then waits at most ~35s). The 2/4 default that most routes
# used to ship is depth 3 and starves everything past the third caller; see plan §63.9.
# `queue_depth` is logged per route at startup and pinned by tests/test_config.py.
redis:
  host: redis          # override via REDIS_HOST env var
  port: 6379
  password: ""
  db: 0

routes:
  - name: DIVIDENDHISTORY
    path: /dyhistory/{ticker}
    url: "https://dividendhistory.org/payout/{ticker}/"
    extract:
      selector: "dl.metrics-list .metric-row"
      label: "Yield"
      field: "dd"
    cache_ttl: 86400          # seconds (24h)
    stale_ttl: 2592000        # seconds (30 days) — max age for stale fallback
    fetch_interval: 2 # min seconds between remote fetches
    fetch_max_wait: 120 # max queue wait before falling back to stale

  - name: OPENST
    path: /dy/{ticker}
    url: "http://openst:8080/dividend/yield/{ticker}"
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: ALPHAVANTAGE
    path: /dy3/{ticker}
    url: "https://www.alphavantage.co/query?function=OVERVIEW&symbol={ticker}&apikey={api_key}"
    json_field: DividendYield
    daily_limit: 25
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120

  - name: FMP
    path: /dy2/{ticker}
    url: "https://financialmodelingprep.com/api/v3/profile/{ticker}?apikey={api_key}"
    daily_limit: 250          # max upstream fetches per calendar day; 0 = unlimited
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120

  # --- openst instruments surface (verified 2026-08-23, see portfoliost docs/openst-coverage.md) ---

  - name: OPENST_PROFILE
    path: /equity/profile/{ticker}
    url: "http://openst:8080/equity/profile/{ticker}"
    cache_ttl: 604800          # 7d — static company facts
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_QUOTE
    path: /equity/quote/{ticker}
    url: "http://openst:8080/equity/quote/{ticker}"
    cache_ttl: 300             # 5min — live-ish quote
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_METRICS
    path: /equity/metrics/{ticker}
    url: "http://openst:8080/equity/metrics/{ticker}"
    cache_ttl: 86400           # 24h
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_SPLITS
    path: /splits/{ticker}
    url: "http://openst:8080/equity/splits/{ticker}"
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_PROJECTIONS
    path: /equity/projections/{ticker}
    url: "http://openst:8080/equity/projections/{ticker}"
    cache_ttl: 86400           # 24h — analyst targets move slowly
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_OHLCV
    path: /ohlcv/{ticker}
    url: "http://openst:8080/price/ohlcv/{ticker}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 21600           # 6h — today's bar keeps updating
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120
    fetch_timeout: 120         # biznesradar multi-page scrape can take ~20s

  - name: OPENST_OHLCV_FUNDS
    path: /ohlcv/fund/{ticker}
    url: "http://openst:8080/price/ohlcv/{ticker}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 86400           # 24h — NAV updates once per business day
    stale_ttl: 2592000
    fetch_interval: 0.5   # biznesradar NAV pages: the openst leg already sleeps 0.3s/page
    fetch_max_wait: 120
    fetch_timeout: 120         # biznesradar multi-page scrape can take ~20s

  # plan §72.39 step 2, stage 4 — fund *category* NAV (analizy.pl), keyed on the
  # provider's own category code (ING01W) rather than a .TFI symbol. A PPO/PPI
  # broker executes against the category NAV, which no other provider we carry
  # serves; ING01W reproduces four of five stored executed prices to the cent.
  #
  # TTL mirrors OPENST_OHLCV_FUNDS: same data (daily NAV), same once-per-business-
  # day cadence. The upstream sets no cache headers of its own, so this is ours.
  #
  # An unknown code is an upstream 404, which main.py passes straight through
  # without caching (a 404 means "no data for this key", not an outage) — so a
  # guessed code stays a loud error instead of a cached empty series.
  - name: OPENST_FUND_CATEGORY_HISTORY
    path: /fund/history/{code}
    url: "http://openst:8080/fund/history/{code}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 86400           # 24h — NAV updates once per business day
    stale_ttl: 2592000
    fetch_interval: 0.2         # single JSON GET, no pagination to pace
    fetch_max_wait: 120
    fetch_timeout: 30

  - name: OPENST_CRYPTO_OHLCV
    path: /crypto/ohlcv/{pair}
    url: "http://openst:8080/crypto/ohlcv/{pair}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 21600           # 6h — mirrors OPENST_OHLCV
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CRYPTO_QUOTE
    path: /crypto/quote/{pair}
    url: "http://openst:8080/crypto/quote/{pair}"
    cache_ttl: 21600           # 6h — daily prices only
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  # --- Polish retail savings bonds (D79, 2026-09-16) ---

  - name: OPENST_BOND_OHLCV
    path: /fixedincome/ohlcv/{symbol}
    url: "http://openst:8080/fixedincome/ohlcv/{symbol}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 21600           # 6h — computed daily prices
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_BOND_QUOTE
    path: /fixedincome/quote/{symbol}
    url: "http://openst:8080/fixedincome/quote/{symbol}"
    cache_ttl: 21600           # 6h — computed daily prices (plan 34.4)
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_BOND_PROFILE
    path: /fixedincome/profile/{symbol}
    url: "http://openst:8080/fixedincome/profile/{symbol}"
    cache_ttl: 86400           # 24h — static bond metadata
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120

  # --- Catalyst corporate bonds (D80, 2026-09-19) ---

  - name: OPENST_CORP_BOND_PROFILE
    path: /corp-bond/profile/{symbol}
    url: "http://openst:8080/corp-bond/profile/{symbol}"
    cache_ttl: 86400           # 24h — static bond metadata (obligacje.pl scrape)
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120
    fetch_timeout: 120         # obligacje.pl scrape can take a few seconds

  - name: OPENST_CORP_BOND_CATALOGUE
    path: /corp-bond/catalogue
    url: "http://openst:8080/corp-bond/catalogue"
    cache_ttl: 43200           # 12h — daily job must always see a fresh-enough scrape
    stale_ttl: 2592000
    fetch_interval: 60
    fetch_max_wait: 4
    fetch_timeout: 120         # obligacje.pl scrape can take a few seconds

  - name: OPENST_BOND_SEARCH
    path: /fixedincome/search/{query}
    url: "http://openst:8080/fixedincome/search/{query}"
    cache_ttl: 3600            # 1h — catalogue moves daily
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  # plan §78 steps 2-4 — the fund-category catalogue and its search. Both are
  # served from openst's snapshot, not scraped: the corpus is 734 codes built by
  # a refresh job, so there is no per-request upstream work to pace here.
  #
  # TTLs follow their peers deliberately — the catalogue mirrors
  # CORP_BOND_CATALOGUE (a daily job must see a fresh-enough snapshot) and the
  # search mirrors OPENST_BOND_SEARCH (per-keystroke, so a short TTL and a real
  # one-hour floor rather than the 7d of the crypto universe search).
  - name: OPENST_FUND_CATALOGUE
    path: /fund/catalogue
    url: "http://openst:8080/fund/catalogue"
    cache_ttl: 43200           # 12h — daily refresh job must see a new snapshot
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120
    fetch_timeout: 30

  - name: OPENST_FUND_SEARCH
    path: /fund/search/{query}
    url: "http://openst:8080/fund/search/{query}"
    cache_ttl: 3600            # 1h — catalogue moves daily
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120
    fetch_timeout: 30

  - name: OPENST_CRYPTO_SEARCH
    path: /crypto/search/{query}
    url: "http://openst:8080/crypto/search/{query}"
    cache_ttl: 604800          # 7d — universe changes rarely (matches OPENST_SEARCH)
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CRYPTO_PROFILE
    path: /crypto/profile/{pair}
    url: "http://openst:8080/crypto/profile/{pair}"
    cache_ttl: 21600           # 6h — matches OPENST_CRYPTO_QUOTE
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_FUNDAMENTALS
    path: /fundamentals/{ticker}
    url: "http://openst:8080/equity/fundamentals/{ticker}?statement={statement}&period={period}"
    query_params: [statement, period]
    # 7d, was 24h. The instruments module now owns freshness for statements: it
    # persists them in Postgres and only asks again when its own window has
    # passed (30d annual, 7d quarter — pfire-docs #51). This TTL no longer decides
    # how fresh the data is, only how often a cold cache re-walks the providers.
    # One route serves both periods so they cannot get separate TTLs here, and 7d
    # sits inside both windows rather than outside either.
    cache_ttl: 604800
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CALENDAR_EARNINGS
    path: /calendar/earnings
    url: "http://openst:8080/equity/calendar/earnings?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 3600            # 1h — consensus figures get revised
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CALENDAR_DIVIDEND
    path: /calendar/dividend
    url: "http://openst:8080/equity/calendar/dividend?start={start}&end={end}"
    query_params: [start, end]
    # 1h kept: with #71 the per-symbol store dominates the dividend calendar
    # path, but this global route is still the only source for GPW (fmp 402 /
    # nasdaq 403 leave it the last contributor). Declared GPW coupon rows and
    # fmp's forward US ex-dates can arrive at any time, so this TTL still
    # bounds how quickly "new" means "visible" there.
    cache_ttl: 3600
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_SEARCH
    path: /equity/search/{query}
    url: "http://openst:8080/equity/search/{query}"
    cache_ttl: 604800          # 7d — universe changes rarely
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_DIVIDENDS
    path: /dividends/{ticker}
    url: "http://openst:8080/dividend/history/{ticker}"
    # 7d, was 24h. The instruments module now owns dividend freshness: it
    # persists history + predicted rows in Postgres and only asks again when
    # its own window has passed (7d history / 7d predicted / 7d empty backoff —
    # pfire-docs #71). This TTL no longer decides how fresh the data is, only
    # how often a cold cache re-walks the providers.
    cache_ttl: 604800
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  # --- SEC ownership / filings surface (openbb-sec, 2026-09-07) ---

  - name: OPENST_OWNERSHIP
    path: /ownership/{ticker}
    url: "http://openst:8080/equity/ownership/{ticker}"
    cache_ttl: 86400           # 24h — Form 4 insider transactions
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_INSTITUTIONAL
    path: /ownership/institutional/{ticker}
    url: "http://openst:8080/equity/ownership/institutional/{ticker}"
    cache_ttl: 604800          # 7d — Form 13F filings are quarterly
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_FILINGS
    path: /filings/{ticker}
    url: "http://openst:8080/equity/filings/{ticker}"
    cache_ttl: 86400           # 24h — new filings arrive during the day
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_MDA
    path: /fundamentals/{ticker}/mda
    url: "http://openst:8080/equity/fundamentals/{ticker}/mda"
    cache_ttl: 604800          # 7d — MD&A updates quarterly with 10-K/10-Q
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  # --- company news (stock-news proposal N2, 2026-09-08) ---

  - name: OPENST_NEWS
    path: /news/company/{ticker}
    url: "http://openst:8080/news/company/{ticker}?start_date={start_date}&limit={limit}"
    query_params: [start_date, limit]
    cache_ttl: 3600            # 1h fresh
    stale_ttl: 86400           # 24h stale fallback
    fetch_interval: 300        # 5min between upstream fetches
    fetch_max_wait: 4

  # --- logo resolution (logos.md D36) — caches the lookup only; binaries are stored by the instruments module ---

  - name: OPENST_LOGO
    path: /logo/{ticker}
    url: "http://openst:8080/equity/logo/{ticker}"
    cache_ttl: 21600           # 6h — resolution result is near-permanent on our side anyway
    stale_ttl: 604800          # 7d stale fallback while openst recovers
    fetch_interval: 0.2
    fetch_max_wait: 120
