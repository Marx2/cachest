name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@776b87d7f227954ac4301a69d41ef8783bc9bb33
    with:
      test_command: docker build --target test -t cachest-test . && docker run --rm cachest-test
    secrets: inherit
    permissions:
      contents: write
      packages: write
