name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@19c638349f725dc2e816f28c7d203d127e0d93ce
    with:
      test_command: docker build --target test -t cachest-test . && docker run --rm cachest-test
    secrets: inherit
    permissions:
      contents: write
      packages: write
