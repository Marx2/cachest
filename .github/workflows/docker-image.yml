name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@f06ee147e41e051c4a6a108e81823073ec57e350
    with:
      test_command: docker build --target test -t cachest-test . && docker run --rm cachest-test
    secrets: inherit
    permissions:
      contents: write
      packages: write
